<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>License Server - 卡密授权管理后台</title>
<style>
:root{
  --primary:#6366f1;--primary-dark:#4f46e5;--primary-light:#e0e7ff;--primary-glow:rgba(99,102,241,.35);
  --success:#10b981;--success-light:#d1fae5;--warning:#f59e0b;--warning-light:#fef3c7;
  --danger:#ef4444;--danger-light:#fee2e2;--info:#3b82f6;--info-light:#dbeafe;
  --purple:#8b5cf6;--purple-light:#ede9fe;--cyan:#06b6d4;--cyan-light:#cffafe;
  --bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --sidebar-bg:#0f172a;--sidebar-bg2:#1e293b;--sidebar-text:#94a3b8;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 6px rgba(0,0,0,.04),0 2px 4px rgba(0,0,0,.03);
  --shadow-lg:0 10px 25px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.04);
  --shadow-xl:0 20px 40px rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input,select,textarea{font-family:inherit;outline:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* ===== Animations ===== */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes barGrow{from{width:0}}

/* ===== Login ===== */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;overflow:hidden;
  background:linear-gradient(-45deg,#6366f1,#8b5cf6,#ec4899,#6366f1);background-size:400% 400%;animation:gradientShift 12s ease infinite}
.login-wrap::before{content:'';position:absolute;inset:0;background:
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0,transparent 40%),
  radial-gradient(circle at 80% 70%,rgba(255,255,255,.06) 0,transparent 40%)}
.login-particle{position:absolute;border-radius:50%;background:rgba(255,255,255,.1);animation:float 6s ease-in-out infinite}
.login-card{background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-radius:20px;padding:44px;width:420px;box-shadow:0 30px 80px rgba(0,0,0,.25);position:relative;z-index:1;animation:scaleIn .5s cubic-bezier(.16,1,.3,1)}
.login-card .login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--purple));margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 20px var(--primary-glow);animation:float 4s ease-in-out infinite}
.login-card h1{text-align:center;font-size:22px;margin-bottom:4px;letter-spacing:-.5px}
.login-card .sub{text-align:center;color:var(--text2);margin-bottom:32px;font-size:14px}
.login-card .form-group{margin-bottom:20px}
.login-card label{display:block;margin-bottom:6px;font-weight:600;font-size:13px;color:var(--text)}
.login-card input{width:100%;padding:11px 16px;border:2px solid var(--border);border-radius:var(--radius);font-size:14px;transition:all .2s;background:#f8fafc}
.login-card input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px var(--primary-light)}
.login-card .btn-login{width:100%;padding:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:var(--radius);font-size:15px;font-weight:600;transition:all .2s;position:relative;overflow:hidden}
.login-card .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 20px var(--primary-glow)}
.login-card .btn-login:active{transform:translateY(0)}
.login-error{color:var(--danger);text-align:center;margin-top:12px;font-size:13px;min-height:18px;transition:all .2s}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--sidebar-bg);display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:100;transition:width .3s}
.sidebar::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,var(--sidebar-bg) 0%,var(--sidebar-bg2) 100%);z-index:-1}
.sidebar .logo{padding:22px 20px;color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar .logo .logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--purple));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px var(--primary-glow);flex-shrink:0}
.sidebar nav{padding:10px 0;flex:1}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:11px 20px;color:var(--sidebar-text);font-size:14px;font-weight:500;transition:all .2s;position:relative;border-left:3px solid transparent}
.sidebar nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.sidebar nav a.active{color:#fff;background:linear-gradient(90deg,rgba(99,102,241,.2),transparent);border-left-color:var(--primary)}
.sidebar nav a.active::after{content:'';position:absolute;right:20px;width:6px;height:6px;border-radius:50%;background:var(--primary);animation:pulse 2s infinite}
.sidebar nav a .icon{width:20px;text-align:center;flex-shrink:0;font-size:16px;transition:transform .2s}
.sidebar nav a:hover .icon{transform:scale(1.15)}
.sidebar .sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.06);color:var(--sidebar-text);font-size:12px;display:flex;align-items:center;gap:8px}
.sidebar .sidebar-footer .status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulseRing 2s infinite}

.main{flex:1;margin-left:230px;display:flex;flex-direction:column;min-height:100vh}
.header{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:var(--shadow);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border)}
.header .page-title{font-size:18px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.header .page-title .title-bar{width:4px;height:20px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--purple))}
.header .header-right{display:flex;align-items:center;gap:16px}
.header .user-info{display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;padding:6px 12px;border-radius:var(--radius);transition:background .2s}
.header .user-info:hover{background:var(--primary-light)}
.header .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;box-shadow:0 2px 8px var(--primary-glow)}
.header .user-dropdown{position:absolute;top:48px;right:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:170px;overflow:hidden;animation:scaleIn .15s ease;transform-origin:top right}
.header .user-dropdown a{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:13px;color:var(--text);transition:all .15s;font-weight:500}
.header .user-dropdown a:hover{background:var(--primary-light);color:var(--primary)}
.content{padding:28px;flex:1;animation:fadeIn .3s ease}

/* ===== Cards ===== */
.card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:24px;margin-bottom:20px;transition:box-shadow .2s;border:1px solid rgba(226,232,240,.5)}
.card:hover{box-shadow:var(--shadow-lg)}
.card-title{font-size:17px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;letter-spacing:-.3px}
.card-title .title-icon{display:inline-flex;align-items:center;gap:8px}

/* ===== Stats ===== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-bottom:28px}
.stat-card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:22px;position:relative;overflow:hidden;transition:all .25s cubic-bezier(.16,1,.3,1);border:1px solid rgba(226,232,240,.5);animation:slideUp .4s ease backwards}
.stat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-xl)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.stat-card.blue::before{background:linear-gradient(90deg,var(--info),var(--cyan))}
.stat-card.green::before{background:linear-gradient(90deg,var(--success),#34d399)}
.stat-card.orange::before{background:linear-gradient(90deg,var(--warning),#fbbf24)}
.stat-card.red::before{background:linear-gradient(90deg,var(--danger),#f87171)}
.stat-card.purple::before{background:linear-gradient(90deg,var(--purple),#a78bfa)}
.stat-card.cyan::before{background:linear-gradient(90deg,var(--cyan),#22d3ee)}
.stat-card .stat-label{color:var(--text2);font-size:13px;margin-bottom:10px;font-weight:500}
.stat-card .stat-value{font-size:32px;font-weight:800;letter-spacing:-1px;animation:countUp .6s ease}
.stat-card .stat-icon{position:absolute;right:18px;top:18px;font-size:32px;opacity:.12;transition:transform .3s}
.stat-card:hover .stat-icon{transform:scale(1.2) rotate(5deg);opacity:.18}
.stat-card .stat-trend{font-size:12px;margin-top:8px;color:var(--text3);display:flex;align-items:center;gap:4px}
.stat-card.blue .stat-value{color:var(--info)}
.stat-card.green .stat-value{color:var(--success)}
.stat-card.orange .stat-value{color:var(--warning)}
.stat-card.red .stat-value{color:var(--danger)}
.stat-card.purple .stat-value{color:var(--purple)}
.stat-card.cyan .stat-value{color:var(--cyan)}
@keyframes countUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ===== Table ===== */
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
table th{text-align:left;padding:12px 14px;background:linear-gradient(180deg,#f8fafc,#f1f5f9);color:var(--text2);font-weight:600;border-bottom:2px solid var(--border);white-space:nowrap;position:relative}
table td{padding:11px 14px;border-bottom:1px solid #f1f5f9;white-space:nowrap;transition:background .15s}
table tbody tr{transition:all .15s}
table tbody tr:hover{background:linear-gradient(90deg,var(--primary-light),transparent)}
table tbody tr:last-child td{border-bottom:none}
table .checkbox-cell{width:44px}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:all .2s;position:relative;overflow:hidden;letter-spacing:.2px}
.btn::after{content:'';position:absolute;width:100%;height:100%;top:0;left:0;background:radial-gradient(circle,rgba(255,255,255,.3) 0,transparent 60%);transform:scale(0);opacity:0;border-radius:50%}
.btn:active::after{transform:scale(1);opacity:1;animation:ripple .5s ease}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 2px 8px var(--primary-glow)}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--primary-glow)}
.btn-success{background:linear-gradient(135deg,var(--success),#059669);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.25)}.btn-success:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,185,129,.3)}
.btn-warning{background:linear-gradient(135deg,var(--warning),#d97706);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.25)}.btn-warning:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(245,158,11,.3)}
.btn-danger{background:linear-gradient(135deg,var(--danger),#dc2626);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.25)}.btn-danger:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(239,68,68,.3)}
.btn-default{background:#f1f5f9;color:var(--text);border:1px solid var(--border)}.btn-default:hover{background:#e2e8f0;transform:translateY(-1px)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* ===== Badge ===== */
.badge{display:inline-flex;align-items:center;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.2px;position:relative}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;margin-right:6px}
.badge-green{background:var(--success-light);color:#059669}.badge-green::before{background:var(--success);animation:pulse 2s infinite}
.badge-blue{background:var(--info-light);color:#2563eb}.badge-blue::before{background:var(--info)}
.badge-orange{background:var(--warning-light);color:#d97706}.badge-orange::before{background:var(--warning)}
.badge-red{background:var(--danger-light);color:#dc2626}.badge-red::before{background:var(--danger)}
.badge-gray{background:#f1f5f9;color:#64748b}.badge-gray::before{background:#94a3b8}
.badge-purple{background:var(--purple-light);color:#7c3aed}.badge-purple::before{background:var(--purple)}

/* ===== Forms ===== */
.form-row{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.form-group{flex:1;min-width:200px}
.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:13px;color:var(--text)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 13px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:14px;transition:all .2s;background:#f8fafc}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-light)}
.form-group textarea{resize:vertical;min-height:80px}

/* ===== Filter bar ===== */
.filter-bar{display:flex;gap:14px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;padding:16px;background:#f8fafc;border-radius:var(--radius);border:1px solid var(--border)}
.filter-bar .form-group{min-width:140px}
.filter-bar .actions{display:flex;gap:8px;align-items:center}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .2s ease}
.modal{background:var(--card);border-radius:var(--radius-lg);padding:28px;width:520px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-xl);animation:scaleIn .25s cubic-bezier(.16,1,.3,1)}
.modal.wide{width:720px}
.modal h3{font-size:18px;margin-bottom:22px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.modal h3::before{content:'';width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--purple))}
.modal .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}

/* ===== Pagination ===== */
.pagination{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.pagination .page-info{color:var(--text2);font-size:13px;font-weight:500}
.pagination .page-btns{display:flex;gap:6px;align-items:center}
.pagination .page-btns button{padding:6px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);font-size:13px;font-weight:500;transition:all .15s}
.pagination .page-btns button:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.pagination .page-btns button:disabled{opacity:.4;cursor:not-allowed}
.pagination .page-btns button.current{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-color:var(--primary);box-shadow:0 2px 6px var(--primary-glow)}

/* ===== Toast ===== */
.toast-container{position:fixed;top:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:10px}
.toast{padding:14px 22px;border-radius:var(--radius);box-shadow:var(--shadow-xl);font-size:14px;font-weight:500;animation:slideInRight .35s cubic-bezier(.16,1,.3,1);max-width:420px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.toast::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.toast-success{background:var(--card);color:var(--success);border:1px solid var(--success-light)}.toast-success::before{background:var(--success)}
.toast-error{background:var(--card);color:var(--danger);border:1px solid var(--danger-light)}.toast-error::before{background:var(--danger)}
.toast-info{background:var(--card);color:var(--info);border:1px solid var(--info-light)}.toast-info::before{background:var(--info)}

/* ===== Misc ===== */
.mono{font-family:'JetBrains Mono','Courier New',monospace;font-size:12px;color:var(--text)}
.copy-btn{cursor:pointer;color:var(--primary);font-size:12px;font-weight:600;transition:all .15s;padding:2px 6px;border-radius:4px}
.copy-btn:hover{background:var(--primary-light)}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty .empty-icon{font-size:48px;opacity:.3;margin-bottom:12px;animation:float 3s ease-in-out infinite}
.loading{text-align:center;padding:50px 20px;color:var(--text2)}
.loading-dots{display:inline-flex;gap:6px;margin-left:8px}
.loading-dots span{width:8px;height:8px;border-radius:50%;background:var(--primary);animation:pulse 1.4s infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
.checkbox{width:16px;height:16px;cursor:pointer;accent-color:var(--primary);transition:transform .15s}
.checkbox:checked{transform:scale(1.15)}
.table-actions{display:flex;gap:6px;flex-wrap:wrap}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;cursor:help;position:relative}
.ellipsis:hover{color:var(--primary)}
.ellipsis-w-sm{max-width:120px}
.ellipsis-w-md{max-width:180px}
.ellipsis-w-lg{max-width:280px}
.click-copy{cursor:pointer;transition:color .15s}
.click-copy:hover{color:var(--primary)}
.click-copy:active{color:var(--primary-dark)}
.kv-list{display:flex;flex-direction:column;gap:10px}
.kv-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(90deg,#f8fafc,transparent);border-radius:var(--radius-sm);border-left:3px solid var(--primary);transition:all .2s}
.kv-item:hover{background:linear-gradient(90deg,var(--primary-light),transparent);transform:translateX(2px)}
.kv-item .k{color:var(--text2);font-weight:500}.kv-item .v{font-weight:600}

/* Skeleton loading */
.skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200px 100%;animation:shimmer 1.5s infinite;border-radius:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-2-sm{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ===== Mobile / Tablet ===== */
.sidebar-toggle{display:none;align-items:center;justify-content:center;font-size:22px;background:none;color:var(--text);padding:6px 10px;border-radius:var(--radius-sm);transition:background .2s;flex-shrink:0}
.sidebar-toggle:hover{background:var(--primary-light)}
.sidebar-toggle:active{background:var(--primary-light)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;backdrop-filter:blur(2px)}
.sidebar-overlay.show{display:block;animation:fadeIn .2s ease}

@media (max-width:1024px){
  .sidebar{transform:translateX(-100%);transition:transform .3s cubic-bezier(.16,1,.3,1);box-shadow:none}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.15)}
  .main{margin-left:0;min-height:auto}
  .sidebar-toggle{display:flex}
  .content{padding:20px;flex:none}
  .app{min-height:auto}
}

@media (max-width:768px){
  :root{--radius-lg:12px}
  .content{padding:14px}
  .header{height:52px;padding:0 14px}
  .header .page-title{font-size:15px}
  .header .page-title .title-bar{height:18px}
  .header .user-info{padding:5px 8px}
  .header .avatar{width:30px;height:30px;font-size:13px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px}

<body>
<div id="app"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
const API_BASE='';
let token=localStorage.getItem('admin_token');
let adminUser=JSON.parse(localStorage.getItem('admin_user')||'null');

/* ===================== Utils ===================== */
async function api(path,opts={}){
  const headers={'Content-Type':'application/json',...opts.headers};
  if(token)headers['Authorization']='Bearer '+token;
  try{
    const resp=await fetch(API_BASE+path,{...opts,headers});
    const data=await resp.json();
    if(!resp.ok||!data.success){throw new Error(data.message||data.error?.type||'请求失败');}
    return data.data;
  }catch(e){
    if(e.message==='Unexpected end of JSON input')throw new Error('网络错误');
    throw e;
  }
}

function toast(msg,type='info'){
  const icons={success:'✓',error:'✕',info:'ℹ'};
  const c=document.getElementById('toastContainer');
  const el=document.createElement('div');
  el.className='toast toast-'+type;
  el.innerHTML=`<span style="font-size:16px;font-weight:700">${icons[type]||''}</span>${msg}`;
  c.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(100%)';setTimeout(()=>el.remove(),300)},3000);
}

function fmtDate(s){if(!s)return '-';let d=new Date(s);if(isNaN(d.getTime()))return s;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}
function fmtStatus(s){
  const m={UNUSED:['gray','未使用'],ACTIVE:['green','已激活'],EXPIRED:['orange','已过期'],DISABLED:['red','已禁用'],active:['green','活跃'],expired:['orange','过期'],revoked:['red','已撤销'],SUCCESS:['green','成功'],FAILED:['red','失败']};
  const v=m[s]||['gray',s];
  return `<span class="badge badge-${v[0]}">${v[1]}</span>`;
}
function escapeHtml(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtAction(a){const m={verify:'验证',activate:'激活',heartbeat:'心跳',deactivate:'注销',login:'登录',logout:'登出',change_password:'修改密码',create_product:'创建产品',update_product:'更新产品',regenerate_api_key:'重置API Key',batch_generate:'批量生成',batch_enable:'批量启用',batch_disable:'批量禁用',batch_extend:'批量续期',update_license:'更新卡密',delete_license:'删除卡密',extend_license:'续期卡密',disable_license:'禁用卡密',enable_license:'启用卡密'};return m[a]||a}
function copyText(text,label){const msg=label?('已复制'+label):'已复制到剪贴板';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast(msg,'success')).catch(()=>fallbackCopy(text,msg));}else{fallbackCopy(text,msg);}}
function fallbackCopy(text,msg){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg,'success');}catch(e){toast('复制失败','error');}document.body.removeChild(ta);}
function debounce(fn,ms=400){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function showLoading(){return `<div class="loading"><span class="spinner"></span><span class="loading-dots"><span></span><span></span><span></span></span> 加载中</div>`}
function showEmpty(msg){return `<div class="empty"><div class="empty-icon">📭</div>${msg||'暂无数据'}</div>`}

/* ===================== Router ===================== */
const routes={
  'dashboard':{title:'仪表盘',render:renderDashboard},
  'licenses':{title:'卡密管理',render:renderLicenses},
  'products':{title:'产品管理',render:renderProducts},
  'sessions':{title:'会话管理',render:renderSessions},
  'logs':{title:'使用日志',render:renderLogs},
  'admin-logs':{title:'操作日志',render:renderAdminLogs},
  'settings':{title:'系统设置',render:renderSettings},
};
function navigate(hash){location.hash=hash;}
function handleRoute(){
  if(dashboardTimer){clearInterval(dashboardTimer);dashboardTimer=null}
  if(!token){renderLogin();return}
  let hash=location.hash.slice(1)||'dashboard';
  const route=routes[hash];
  if(!route){hash='dashboard';}
  renderLayout(hash);
}
window.addEventListener('hashchange',handleRoute);

/* ===================== Login ===================== */
function renderLogin(){
  let particles='';
  for(let i=0;i<12;i++){const s=20+Math.random()*40;particles+=`<div class="login-particle" style="width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s;animation-duration:${4+Math.random()*4}s"></div>`}
  document.getElementById('app').innerHTML=`
  <div class="login-wrap">${particles}
    <div class="login-card">
      <div class="login-logo">🔐</div>
      <h1>License Server</h1>
      <p class="sub">卡密授权管理后台</p>
      <form id="loginForm">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="loginUser" placeholder="请输入用户名" value="admin" autocomplete="username">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPass" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <div class="login-error" id="loginError"></div>
        <button type="submit" class="btn-login">登 录</button>
      </form>
    </div>
  </div>`;
  document.getElementById('loginForm').onsubmit=async(e)=>{
    e.preventDefault();
    const username=document.getElementById('loginUser').value.trim();
    const password=document.getElementById('loginPass').value.trim();
    if(!username||!password){document.getElementById('loginError').textContent='请输入用户名和密码';return}
    try{
      const data=await api('/api/v1/admin/auth/login',{method:'POST',body:JSON.stringify({username,password})});
      token=data.token;adminUser={username:data.username,role:data.role};
      localStorage.setItem('admin_token',token);
      localStorage.setItem('admin_user',JSON.stringify(adminUser));
      handleRoute();
    }catch(err){document.getElementById('loginError').textContent=err.message}
  };
}

/* ===================== Layout ===================== */
function renderLayout(activeHash){
  const navItems=[
    {hash:'dashboard',icon:'📊',label:'仪表盘'},
    {hash:'licenses',icon:'🔑',label:'卡密管理'},
    {hash:'products',icon:'📦',label:'产品管理'},
    {hash:'sessions',icon:'🔗',label:'会话管理'},
    {hash:'logs',icon:'📋',label:'使用日志'},
    {hash:'admin-logs',icon:'📝',label:'操作日志'},
    {hash:'settings',icon:'⚙️',label:'系统设置'},
  ];
  const navHtml=navItems.map((n,i)=>`<a href="#${n.hash}" class="${activeHash===n.hash?'active':''}" style="animation:fadeIn .3s ease ${i*.04}s backwards"><span class="icon">${n.icon}</span>${n.label}</a>`).join('');
  const route=routes[activeHash]||routes['dashboard'];
  document.getElementById('app').innerHTML=`
  <div class="app">
    <div class="sidebar" id="sidebar">
      <div class="logo"><div class="logo-icon">🔐</div>License Server</div>
      <nav id="navMenu">${navHtml}</nav>
      <div class="sidebar-footer"><span class="status-dot"></span>系统运行中 · v1.0.0</div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="main">
      <div class="header">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
        <div class="page-title"><span class="title-bar"></span>${route.title}</div>
        <div class="header-right">
          <div class="user-info" id="userInfo">
            <div class="avatar">${(adminUser?.username||'A')[0].toUpperCase()}</div>
            <span style="font-weight:600">${escapeHtml(adminUser?.username||'')}</span>
            <span style="color:var(--text3);font-size:12px">▾</span>
            <div class="user-dropdown hidden" id="userDropdown">
              <a href="#settings">⚙️ 系统设置</a>
              <a id="logoutBtn">🚪 退出登录</a>
            </div>
          </div>
        </div>
      </div>
      <div class="content" id="content">${showLoading()}</div>
    </div>
  </div>`;
  const sidebar=document.getElementById('sidebar'),overlay=document.getElementById('sidebarOverlay');
  function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('show')}
  function openSidebar(){sidebar.classList.add('open');overlay.classList.add('show')}
  document.getElementById('sidebarToggle').onclick=()=>{sidebar.classList.contains('open')?closeSidebar():openSidebar()};
  overlay.onclick=closeSidebar;
  document.getElementById('navMenu').onclick=()=>{if(window.innerWidth<=1024)closeSidebar()};
  document.getElementById('userInfo').onclick=(e)=>{e.stopPropagation();document.getElementById('userDropdown').classList.toggle('hidden');};
  document.addEventListener('click',()=>document.getElementById('userDropdown')?.classList.add('hidden'));
  document.getElementById('logoutBtn').onclick=async()=>{
    try{await api('/api/v1/admin/auth/logout',{method:'POST'})}catch(e){}
    token=null;adminUser=null;
    localStorage.removeItem('admin_token');localStorage.removeItem('admin_user');
    renderLogin();
  };
  route.render();
}

    </div>`;
    requestAnimationFrame(()=>{
      document.querySelectorAll('.act-bar').forEach((bar,i)=>{setTimeout(()=>{bar.style.width=bar.dataset.w+'%'},i*150+100)});
    });
    }catch(err){c.innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div>加载失败: ${escapeHtml(err.message)}</div>`}
  }
  window.loadDashboard=loadDashboard;
  loadDashboard();
  if(dashboardTimer)clearInterval(dashboardTimer);
  dashboardTimer=setInterval(()=>{if(document.getElementById('content'))loadDashboard()},15000);
}

function resetLicenseFilters(){licenseFilters={product_id:'',status:'',keyword:'',page:1,page_size:20};renderLicenses()}

async function loadLicenses(){
  const t=document.getElementById('licenseTable');if(!t)return;
  t.innerHTML=showLoading();

    const params=new URLSearchParams();

    if(licenseFilters.keyword)params.set('keyword',licenseFilters.keyword);
    params.set('page',licenseFilters.page);params.set('page_size',licenseFilters.page_size);
    const d=await api('/api/v1/admin/licenses?'+params.toString());
    const items=d.items||[];
    if(items.length===0){t.innerHTML=showEmpty('暂无卡密数据，点击"批量生成"创建');renderLicensePagination(d.total);return}
    t.innerHTML=`
    <div class="table-wrap"><table>
      <thead><tr>
        <th class="checkbox-cell"><input type="checkbox" class="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)"></th>
        <th>卡密</th><th>卡密ID</th><th>产品</th><th>时长</th><th>状态</th><th>单机</th><th>备注</th><th>创建时间</th><th>激活时间</th><th>到期时间</th><th>操作</th>

          <td class="mono ellipsis ellipsis-w-sm click-copy" title="${escapeHtml(l.license_id)}" onclick="copyText('${escapeHtml(l.license_id)}','卡密ID')">${escapeHtml(l.license_id)}</td>
          <td class="ellipsis ellipsis-w-sm click-copy" title="${escapeHtml(l.product_id)}" onclick="copyText('${escapeHtml(l.product_id)}','产品ID')">${escapeHtml(l.product_id)}</td>
          <td>${l.duration} ${l.duration_unit==='minute'?'分钟':l.duration_unit==='hour'?'小时':'天'}</td>
          <td>${fmtStatus(l.status)}</td>
          <td>${l.bind_machine?'<span class="badge badge-purple">是</span>':'<span class="badge badge-gray">否</span>'}</td>

          <td>${fmtDate(l.created_at)}</td>
          <td>${fmtDate(l.activated_at)}</td>
          <td>${fmtDate(l.expire_at)}</td>
          <td><div class="table-actions">
            ${l.status==='DISABLED'?`<button class="btn btn-success btn-sm" onclick="singleOp('enable','${l.license_id}')">启用</button>`:`<button class="btn btn-warning btn-sm" onclick="singleOp('disable','${l.license_id}')">禁用</button>`}
            <button class="btn btn-primary btn-sm" onclick="showExtendModal('${l.license_id}')">续期</button>
            <button class="btn btn-default btn-sm" onclick="showLicenseDetail('${l.license_id}')">详情</button>
            <button class="btn btn-danger btn-sm" onclick="singleOp('delete','${l.license_id}')">删除</button>
          </div></td>
        </tr>`).join('')}</tbody>
    </table></div>`;
    renderLicensePagination(d.total);updateSelectedBar();
  }catch(err){t.innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div>加载失败: ${escapeHtml(err.message)}</div>`}
}

function renderLicensePagination(total){
  const totalPages=Math.ceil(total/licenseFilters.page_size)||1;const cur=licenseFilters.page;
  let btns='';const start=Math.max(1,cur-2),end=Math.min(totalPages,cur+2);
  if(start>1)btns+=`<button onclick="licenseFilters.page=1;loadLicenses()">1</button>`;
  if(start>2)btns+='<span style="color:var(--text3)">...</span>';
  for(let i=start;i<=end;i++)btns+=`<button class="${i===cur?'current':''}" onclick="licenseFilters.page=${i};loadLicenses()">${i}</button>`;
  if(end<totalPages-1)btns+='<span style="color:var(--text3)">...</span>';
  if(end<totalPages)btns+=`<button onclick="licenseFilters.page=${totalPages};loadLicenses()">${totalPages}</button>`;
  const el=document.createElement('div');el.className='pagination';
  el.innerHTML=`<div class="page-info">共 ${total} 条，第 ${cur}/${totalPages} 页</div><div class="page-btns">${btns}</div>`;
  document.getElementById('licenseTable').appendChild(el);
}

function toggleSelect(id,checked){if(checked)selectedLicenses.add(id);else selectedLicenses.delete(id);updateSelectedBar()}
function toggleSelectAll(checked){document.querySelectorAll('.lic-check').forEach(cb=>{cb.checked=checked;if(checked)selectedLicenses.add(cb.value);else selectedLicenses.delete(cb.value);});updateSelectedBar();}
function updateSelectedBar(){const bar=document.getElementById('licenseBatchBar');if(!bar)return;if(selectedLicenses.size>0){bar.classList.remove('hidden');document.getElementById('selectedCount').textContent='已选 '+selectedLicenses.size+' 项'}else bar.classList.add('hidden');}

async function singleOp(op,id){
  if(op==='delete'&&!confirm('确认删除此卡密？此操作不可恢复。'))return;
  try{
    if(op==='enable')await api(`/api/v1/admin/licenses/${id}/enable`,{method:'POST'});
    else if(op==='disable')await api(`/api/v1/admin/licenses/${id}/disable`,{method:'POST'});
    else if(op==='delete')await api(`/api/v1/admin/licenses/${id}`,{method:'DELETE'});
    toast('操作成功','success');loadLicenses();
  }catch(err){toast(err.message,'error')}
}

async function batchOp(op){
  const ids=Array.from(selectedLicenses);if(ids.length===0)return;
  if(op==='delete'&&!confirm(`确认删除选中的 ${ids.length} 个卡密？此操作不可恢复。`))return;
  try{
    if(op==='enable')await api('/api/v1/admin/licenses/batch-enable',{method:'POST',body:JSON.stringify({license_ids:ids})});
    else if(op==='disable')await api('/api/v1/admin/licenses/batch-disable',{method:'POST',body:JSON.stringify({license_ids:ids})});
    else if(op==='delete'){for(const id of ids)await api(`/api/v1/admin/licenses/${id}`,{method:'DELETE'});}
    toast('批量操作成功','success');selectedLicenses.clear();loadLicenses();
  }catch(err){toast(err.message,'error')}
}

    try{
      if(p){const body={product_name:document.getElementById('pName').value,description:document.getElementById('pDesc').value};const st=document.getElementById('pStatus');if(st)body.status=st.value;await api(`/api/v1/admin/products/${p.product_id}`,{method:'PATCH',body:JSON.stringify(body)});}
      else{const body={product_id:document.getElementById('pId').value,product_name:document.getElementById('pName').value,description:document.getElementById('pDesc').value||null};if(!body.product_id){toast('请输入产品ID','error');return}if(!body.product_name){toast('请输入产品名称','error');return}await api('/api/v1/admin/products',{method:'POST',body:JSON.stringify(body)});}
      m.remove();toast('保存成功','success');renderProducts();
    }catch(err){toast(err.message,'error')}
  };
}

async function regenKey(id){if(!confirm('确认重置API Key？旧Key将立即失效。'))return;try{const d=await api(`/api/v1/admin/products/${id}/regenerate-key`,{method:'POST'});toast('API Key已重置','success');copyText(d.api_key);renderProducts();}catch(err){toast(err.message,'error')}}

/* ===================== Sessions ===================== */
let sessionFilters={license_id:'',product_id:'',status:'',page:1,page_size:20};
async function renderSessions(){
  const c=document.getElementById('content');if(productCache.length===0)await loadProducts();
  c.innerHTML=`<div class="card"><div class="card-title"><span class="title-icon">🔗 会话列表</span></div>
    <div class="filter-bar">
      <div class="form-group"><label>卡密ID</label><input type="text" id="sLic" placeholder="精确匹配" oninput="clearTimeout(this._t);this._t=setTimeout(()=>{sessionFilters.license_id=this.value;sessionFilters.page=1;loadSessions()},400)"></div>
      <div class="form-group"><label>产品</label><select id="sProduct" onchange="sessionFilters.product_id=this.value;sessionFilters.page=1;loadSessions()"><option value="">全部</option>${productCache.map(p=>`<option value="${p.product_id}">${escapeHtml(p.product_name)}</option>`).join('')}</select></div>
      <div class="form-group"><label>状态</label><select id="sStatus" onchange="sessionFilters.status=this.value;sessionFilters.page=1;loadSessions()"><option value="">全部</option><option value="active">活跃</option><option value="expired">过期</option><option value="revoked">已撤销</option></select></div>

async function loadSessions(){
  const t=document.getElementById('sessionTable');if(!t)return;t.innerHTML=showLoading();
  try{
    const params=new URLSearchParams();
    if(sessionFilters.license_id)params.set('license_id',sessionFilters.license_id);
    if(sessionFilters.product_id)params.set('product_id',sessionFilters.product_id);
    if(sessionFilters.status)params.set('status',sessionFilters.status);
    params.set('page',sessionFilters.page);params.set('page_size',sessionFilters.page_size);
    const d=await api('/api/v1/admin/sessions?'+params.toString());const items=d.items||[];
    if(items.length===0){t.innerHTML=showEmpty('暂无会话数据');return}
    t.innerHTML=`<div class="table-wrap"><table>
      <thead><tr><th>会话ID</th><th>卡密ID</th><th>产品</th><th>机器ID</th><th>IP</th><th>状态</th><th>创建时间</th><th>最后心跳</th><th>到期时间</th></tr></thead>
      <tbody>${items.map((s,i)=>`<tr style="animation:fadeIn .2s ease ${i*.02}s backwards">
        <td class="mono ellipsis ellipsis-w-sm click-copy" title="${escapeHtml(s.session_id||'')}" onclick="copyText('${escapeHtml(s.session_id)}','会话ID')">${escapeHtml(s.session_id?.slice(0,16))}...</td><td class="mono ellipsis ellipsis-w-sm click-copy" title="${escapeHtml(s.license_id||'')}" onclick="copyText('${escapeHtml(s.license_id)}','卡密ID')">${escapeHtml(s.license_id?.slice(0,16))}...</td>
        <td class="ellipsis ellipsis-w-sm click-copy" title="${escapeHtml(s.product_id||'')}" onclick="copyText('${escapeHtml(s.product_id)}','产品ID')">${escapeHtml(s.product_id)}</td><td class="mono ellipsis ellipsis-w-md click-copy" title="${escapeHtml(s.machine_id||'')}" onclick="copyText('${escapeHtml(s.machine_id||'')}','机器ID')">${escapeHtml(s.machine_id?.slice(0,20)||'-')}</td>
        <td class="ellipsis ellipsis-w-sm" title="${escapeHtml(s.ip||'')}">${escapeHtml(s.ip||'-')}</td><td>${fmtStatus(s.status)}</td>
        <td>${fmtDate(s.created_at)}</td><td>${fmtDate(s.last_seen_at)}</td><td>${fmtDate(s.expire_at)}</td>
      </tr>`).join('')}</tbody></table></div>`;
    const total=d.total,totalPages=Math.ceil(total/sessionFilters.page_size)||1;
    if(totalPages>1){let btns='';for(let i=1;i<=Math.min(totalPages,10);i++)btns+=`<button class="${i===sessionFilters.page?'current':''}" onclick="sessionFilters.page=${i};loadSessions()">${i}</button>`;const pg=document.createElement('div');pg.className='pagination';pg.innerHTML=`<div class="page-info">共 ${total} 条，第 ${sessionFilters.page}/${totalPages} 页</div><div class="page-btns">${btns}</div>`;t.appendChild(pg);}
  }catch(err){t.innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div>加载失败: ${escapeHtml(err.message)}</div>`}
}

/* ===================== Usage Logs ===================== */
let logFilters={license_id:'',product_id:'',ip:'',machine_id:'',result:'',page:1,page_size:20};
async function renderLogs(){
  const c=document.getElementById('content');if(productCache.length===0)await loadProducts();
  c.innerHTML=`<div class="card"><div class="card-title"><span class="title-icon">📋 使用日志</span><button class="btn btn-default btn-sm" onclick="logFilters={license_id:'',product_id:'',ip:'',machine_id:'',result:'',page:1,page_size:20};renderLogs()">重置</button></div>
    <div class="filter-bar">
      <div class="form-group"><label>卡密ID</label><input type="text" id="lLic" oninput="clearTimeout(this._t);this._t=setTimeout(()=>{logFilters.license_id=this.value;logFilters.page=1;loadLogs()},400)"></div>
      <div class="form-group"><label>产品</label><select id="lProduct" onchange="logFilters.product_id=this.value;logFilters.page=1;loadLogs()"><option value="">全部</option>${productCache.map(p=>`<option value="${p.product_id}">${escapeHtml(p.product_name)}</option>`).join('')}</select></div>
      <div class="form-group"><label>IP</label><input type="text" id="lIp" oninput="clearTimeout(this._t);this._t=setTimeout(()=>{logFilters.ip=this.value;logFilters.page=1;loadLogs()},400)"></div>
      <div class="form-group"><label>结果</label><select id="lResult" onchange="logFilters.result=this.value;logFilters.page=1;loadLogs()"><option value="">全部</option><option value="SUCCESS">成功</option><option value="FAILED">失败</option></select></div>
    </div>

async function loadLogs(){
  const t=document.getElementById('logTable');if(!t)return;t.innerHTML=showLoading();
  try{
    const params=new URLSearchParams();
    if(logFilters.license_id)params.set('license_id',logFilters.license_id);
    if(logFilters.product_id)params.set('product_id',logFilters.product_id);
    if(logFilters.ip)params.set('ip',logFilters.ip);
    if(logFilters.machine_id)params.set('machine_id',logFilters.machine_id);
    if(logFilters.result)params.set('result',logFilters.result);
    params.set('page',logFilters.page);params.set('page_size',logFilters.page_size);
    const d=await api('/api/v1/admin/logs?'+params.toString());const items=d.items||[];
    if(items.length===0){t.innerHTML=showEmpty('暂无日志数据');return}
    t.innerHTML=`<div class="table-wrap"><table>
      <thead><tr><th>时间</th><th>动作</th><th>卡密ID</th><th>产品</th><th>IP</th><th>地区</th><th>机器ID</th><th>版本</th><th>结果</th></tr></thead>
      <tbody>${items.map((l,i)=>`<tr style="animation:fadeIn .2s ease ${i*.01}s backwards">
        <td>${fmtDate(l.request_time)}</td><td><span class="badge badge-blue">${fmtAction(l.action||'-')}</span></td>
        <td class="mono ellipsis ellipsis-w-sm click-copy" title="${escapeHtml(l.license_id||'')}" onclick="copyText('${escapeHtml(l.license_id||'')}','卡密ID')">${escapeHtml(l.license_id?.slice(0,16)||'-')}...</td><td class="ellipsis ellipsis-w-sm click-copy" title="${escapeHtml(l.product_id||'')}" onclick="copyText('${escapeHtml(l.product_id||'')}','产品ID')">${escapeHtml(l.product_id||'-')}</td>
        <td class="ellipsis ellipsis-w-sm" title="${escapeHtml(l.ip||'')}">${escapeHtml(l.ip||'-')}</td><td class="ellipsis ellipsis-w-md" title="${escapeHtml([l.country,l.region,l.city].filter(Boolean).join(' / ')||'-')}">${escapeHtml([l.country,l.region,l.city].filter(Boolean).join(' / ')||'-')}</td>
        <td class="mono ellipsis ellipsis-w-md click-copy" title="${escapeHtml(l.machine_id||'')}" onclick="copyText('${escapeHtml(l.machine_id||'')}','机器ID')">${escapeHtml(l.machine_id?.slice(0,20)||'-')}</td><td class="ellipsis ellipsis-w-sm" title="${escapeHtml(l.client_version||'')}">${escapeHtml(l.client_version||'-')}</td><td>${fmtStatus(l.result)}</td>
      </tr>`).join('')}</tbody></table></div>`;
    const total=d.total,totalPages=Math.ceil(total/logFilters.page_size)||1;
    if(totalPages>1){let btns='';const cur=logFilters.page,start=Math.max(1,cur-2),end=Math.min(totalPages,cur+2);for(let i=start;i<=end;i++)btns+=`<button class="${i===cur?'current':''}" onclick="logFilters.page=${i};loadLogs()">${i}</button>`;const pg=document.createElement('div');pg.className='pagination';pg.innerHTML=`<div class="page-info">共 ${total} 条，第 ${cur}/${totalPages} 页</div><div class="page-btns">${btns}</div>`;t.appendChild(pg);}
  }catch(err){t.innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div>加载失败: ${escapeHtml(err.message)}</div>`}
}

    <div class="form-row"><div class="form-group" style="max-width:320px"><label>旧密码</label><input type="password" id="oldPass" placeholder="请输入旧密码"></div></div>
    <div class="form-row"><div class="form-group" style="max-width:320px"><label>新密码（至少8位）</label><input type="password" id="newPass" placeholder="请输入新密码"></div></div>
    <div class="form-row"><div class="form-group" style="max-width:320px"><label>确认新密码</label><input type="password" id="newPass2" placeholder="再次输入新密码"></div></div>
    <button class="btn btn-primary" id="changePassBtn">修改密码</button>
  </div>
  <div class="card" style="animation:slideUp .3s ease .1s backwards">
    <div class="card-title"><span class="title-icon">ℹ️ 系统信息</span></div>
    <div class="kv-list">

      <div class="kv-item"><span class="k">角色</span><span class="v">${escapeHtml(adminUser?.role||'-')}</span></div>
      <div class="kv-item"><span class="k">API文档</span><span class="v"><a href="/api/docs" target="_blank" style="color:var(--primary)">/api/docs ↗</a></span></div>
      <div class="kv-item"><span class="k">ReDoc文档</span><span class="v"><a href="/api/redoc" target="_blank" style="color:var(--primary)">/api/redoc ↗</a></span></div>
      <div class="kv-item"><span class="k">健康检查</span><span class="v"><a href="/health" target="_blank" style="color:var(--primary)">/health ↗</a></span></div>
    </div>
  </div>`;
  document.getElementById('changePassBtn').onclick=async()=>{
    const oldP=document.getElementById('oldPass').value;const newP=document.getElementById('newPass').value;const newP2=document.getElementById('newPass2').value;
    if(!oldP||!newP){toast('请填写完整','error');return}
    if(newP.length<8){toast('新密码至少8位','error');return}
    if(newP!==newP2){toast('两次密码不一致','error');return}
    try{await api('/api/v1/admin/auth/change-password',{method:'POST',body:JSON.stringify({old_password:oldP,new_password:newP})});toast('密码修改成功','success');document.getElementById('oldPass').value='';document.getElementById('newPass').value='';document.getElementById('newPass2').value='';}catch(err){toast(err.message,'error')}
  };
}
