<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授权验证</title>

<!-- 字体：显示字体走 Bricolage Grotesque，技术信息用 JetBrains Mono，中文回落思源黑体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="client-theme.css">

<script>
/* 主题必须在首次渲染前确定，否则会出现白色闪屏。
   此时 client-core.js 还没加载，所以这里不读 CONFIG，
   只处理 localStorage 里记住的偏好；CONFIG 的 forceTheme/followSystem
   会在 core 加载后由 applyTheme 补齐。 */
(function () {
  var theme = 'light';
  try {
    var saved = localStorage.getItem('lc_theme');
    if (saved === 'light' || saved === 'dark') theme = saved;
  } catch (e) { /* 读取失败就用日间 */ }
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
</head>
<body>

<div class="lc-backdrop"></div>
<div class="lc-noise"></div>
<div class="lc-toast-wrap" id="toastWrap"></div>

<div class="lc-root">

  <!-- 面板外壳：两个视图共用，靠宽度切换制造层次变化 -->
  <div class="lc-panel lc-panel--narrow" id="shellPanel">
    <span class="lc-corner tl"></span><span class="lc-corner tr"></span>
    <span class="lc-corner bl"></span><span class="lc-corner br"></span>

    <!-- 品牌区 -->
    <header class="lc-brand">
      <div class="lc-logo" id="logoText">N</div>
      <div class="lc-brand-text">
        <div class="lc-brand-name" id="brandName">Nova Studio</div>
        <div class="lc-brand-sub" id="brandSub">v1.0.0</div>
      </div>
      <!-- 日夜主题切换 -->
      <button class="lc-theme-btn" id="themeBtn" title="切换日间/夜间主题" aria-label="切换主题">
        <svg class="lc-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="lc-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </header>

    <!-- ==================== 验证视图 ==================== -->
    <section class="lc-view" id="viewVerify">
      <div class="lc-body">
        <!-- 验证结果提示 -->
        <div class="lc-alert" id="verifyAlert"></div>

        <!-- 顶号风险提示 -->
        <div class="lc-notice" id="kickNotice"></div>

        <div style="font-family:var(--lc-font-display);font-size:21px;font-weight:700;letter-spacing:-.4px;margin-bottom:22px"
             id="verifyTitle">输入卡密以继续</div>

        <form id="verifyForm">
          <div class="lc-field">
            <label class="lc-label" for="licenseInput">
              <span>卡密</span>
              <span class="lc-label-hint">区分大小写</span>
            </label>
            <input type="text" class="lc-input lc-input--key" id="licenseInput"
                   placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" autofocus>
          </div>

          <div class="lc-field" id="machineField" style="display:none">
            <label class="lc-label" for="machineIdInput">
              <span>机器 ID</span>
              <span class="lc-label-hint">留空自动生成</span>
            </label>
            <input type="text" class="lc-input" id="machineIdInput" placeholder="自动生成">
          </div>

          <div class="lc-field">
            <button type="submit" class="lc-btn lc-btn--primary" id="verifyBtn">验证并进入</button>
          </div>
        </form>

        <!-- 次级操作 -->
        <div class="lc-btn-row" style="margin-top:4px">
          <button class="lc-btn lc-btn--soft" id="getKeyBtn">获取卡密</button>
          <button class="lc-btn lc-btn--ghost" id="closeBtn">关闭程序</button>
        </div>
      </div>
    </section>

    <!-- ==================== 应用视图 ==================== -->
    <section class="lc-view" id="viewApp">
      <!-- 授权状态主视觉区 -->
      <div class="lc-auth-hero" id="authHero">
        <div class="lc-auth-status"><span class="lc-dot"></span><span id="authStatusText">授权有效</span></div>

        <div class="lc-countdown" id="countdownBox">
          <span id="countdownText">--</span>
          <span class="lc-countdown-unit">剩余</span>
        </div>

        <div class="lc-auth-expire-label">
          <span id="expireLabel">到期时间</span> · <b id="expireTime">-</b>
        </div>

        <div class="lc-auth-bar" id="authProgress" style="width:0%"></div>
      </div>

      <!-- 授权详情 -->
      <div class="lc-body">
        <div class="lc-dl" id="authDetail"></div>

        <div class="lc-btn-row" style="margin-top:26px">
          <button class="lc-btn lc-btn--danger" id="logoutBtn">退出授权</button>
        </div>
      </div>
    </section>

    <!-- 日志工具条 -->
    <div class="lc-logbar" id="logbar">
      <button class="lc-logbar-btn" id="logToggle">
        <span>运行日志</span>
        <span class="lc-logbar-badge" id="logBadge">0</span>
      </button>
      <span class="lc-logbar-spacer"></span>
      <span style="font-size:10.5px;color:var(--lc-text-3)">排查问题时请复制日志反馈</span>
    </div>

    <!-- 日志面板 -->
    <div class="lc-log" id="log">
      <div class="lc-log-head">
        <button class="lc-log-tab is-active" data-filter="all">全部</button>
        <button class="lc-log-tab" data-filter="api">网络请求</button>
        <button class="lc-log-tab" data-filter="error">仅错误</button>
        <span style="flex:1"></span>
        <button class="lc-log-action" id="logCopy" title="复制诊断信息与日志">复制诊断</button>
        <button class="lc-log-action" id="logClear">清空</button>
      </div>
      <div class="lc-log-list" id="logList">
        <div class="lc-log-empty">暂无日志记录</div>
      </div>
    </div>

    <!-- 页脚 -->
    <footer class="lc-foot">
      <span id="footProduct">Nova Studio v1.0.0</span>
      <span id="footServer">http://127.0.0.1:8000</span>
    </footer>
  </div>
</div>

<!-- ==================== 获取卡密弹窗 ==================== -->
<div class="lc-overlay" id="getKeyModal">
  <div class="lc-modal">
    <span class="lc-corner tl"></span><span class="lc-corner tr"></span>
    <div class="lc-modal-head">
      <div class="lc-modal-title">
        <span class="lc-modal-title-icon">🎫</span>
        <span>获取卡密</span>
      </div>
    </div>
    <div class="lc-modal-body" id="getKeyBody"></div>
    <div class="lc-modal-foot">
      <button class="lc-btn lc-btn--ghost" id="getKeyClose">关闭</button>
    </div>
  </div>
</div>

<!-- ==================== 通用确认弹窗 ==================== -->
<div class="lc-overlay" id="confirmModal">
  <div class="lc-modal">
    <span class="lc-corner tl"></span><span class="lc-corner tr"></span>
    <div class="lc-modal-head">
      <div class="lc-modal-title">
        <span class="lc-modal-title-icon">⚠</span>
        <span id="confirmTitle">确认操作</span>
      </div>
    </div>
    <div class="lc-modal-body" id="confirmBody"></div>
    <div class="lc-modal-foot">
      <button class="lc-btn lc-btn--ghost" id="confirmCancel">取消</button>
      <button class="lc-btn lc-btn--primary" id="confirmOk">确认</button>
    </div>
  </div>
</div>

<script src="client-core.js?v=2"></script>
</body>
</html>
